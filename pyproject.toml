[project]
name = "finra-otc"
version = "0.2.0"
description = "Capture FINRA OTC market data as raw files, then build Parquet tables"
readme = "README.md"
requires-python = ">=3.14.8"
dependencies = [
    "pyarrow>=22",
    "requests>=2.32",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = ["codespell", "ipdb", "mypy", "pyarrow-stubs", "ruff", "types-requests", "types-tqdm"]
test = ["pytest"]

[project.scripts]
finra-otc = "finra_otc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finra_otc"]

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.codespell]
skip = "./.venv,./.git,./data,*.ipynb"

[tool.mypy]
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
pythonpath = ["tests"]
